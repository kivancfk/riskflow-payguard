services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-riskflow}
      POSTGRES_USER: ${POSTGRES_USER:-riskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riskflow-local}
    volumes:
      - payguard-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-riskflow} -d ${POSTGRES_DB:-riskflow}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
    image: riskflow-payguard:phase7-local
    environment:
      DATABASE_URL: >-
        postgresql+psycopg2://${POSTGRES_USER:-riskflow}:${POSTGRES_PASSWORD:-riskflow-local}@postgres:5432/${POSTGRES_DB:-riskflow}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  dashboard:
    build:
      context: .
    image: riskflow-payguard:phase7-local
    environment:
      DATABASE_URL: >-
        postgresql+psycopg2://${POSTGRES_USER:-riskflow}:${POSTGRES_PASSWORD:-riskflow-local}@postgres:5432/${POSTGRES_DB:-riskflow}
      PAYGUARD_API_URL: http://api:8000
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
    command:
      [
        "python",
        "-m",
        "streamlit",
        "run",
        "dashboard/app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
        "--server.headless=true",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  payguard-postgres-data:
